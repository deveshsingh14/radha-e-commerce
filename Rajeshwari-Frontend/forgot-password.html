<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — Radha E-Commerce</title>
  <link rel="stylesheet" href="store.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
    }
    .auth-card {
      position: relative;
      background: #fff;
      padding: 32px 24px;
      border-radius: 20px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    .auth-logo {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 24px;
      color: var(--ink);
    }
    .auth-card input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 15px;
      outline: none;
      box-sizing: border-box;
    }
    .auth-card .btn-solid {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
    }
    .back-link {
      display: inline-block;
      margin-top: 16px;
      font-size: 14px;
      color: var(--ink);
      text-decoration: underline;
    }
  </style>
  <!-- error monitoring (Sentry): loaded first so early errors are caught -->
  <script src="https://browser.sentry-cdn.com/10.76.0/bundle.min.js" integrity="sha384-u3LEtTEG6KWPHY0VVN7bBPicdzr6WUxoX7cCj1yfI9uxlxWoLpD/PmEJH+IDNPvw" crossorigin="anonymous"></script>
  <script src="monitoring.js"></script>
</head>
<body>

  <div class="auth-card">
    <div class="auth-logo">Radha E-Commerce</div>
    <h2>Reset Password</h2>
    <p class="auth-sub" style="margin-bottom: 20px; font-size: 14px; color: var(--mute);">Enter your email address to receive a password reset link.</p>
    <input type="email" id="email" placeholder="Email address">
    <button class="btn-solid" onclick="requestReset()">Send Reset Link</button>
    <a href="index.html" class="back-link">Back to home</a>
  </div>

  <div id="toast"></div>

  <script src="api.js"></script>
  <script>
    async function requestReset() {
      const email = document.getElementById("email").value.trim();
      if (!email) {
        toast("Please enter your email");
        return;
      }
      
      try {
        const btn = document.querySelector(".btn-solid");
        btn.textContent = "Sending...";
        btn.disabled = true;

        const res = await fetch(`${API_URL}/auth/forgot-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });
        
        const data = await res.json();
        
        if (res.ok) {
          toast("If an account exists, a reset link was sent.");
          document.getElementById("email").value = "";
        } else {
          toast(data.message || "Something went wrong");
        }
      } catch (e) {
        toast("Failed to request password reset");
      } finally {
        const btn = document.querySelector(".btn-solid");
        btn.textContent = "Send Reset Link";
        btn.disabled = false;
      }
    }

  </script>
</body>
</html>
